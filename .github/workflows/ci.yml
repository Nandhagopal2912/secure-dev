# SecureOps CI.
#
# CI is attack surface (CLAUDE.md §16): the default token is read-only, scopes
# are granted per job, and every third-party action is pinned to an immutable
# commit SHA rather than a mutable tag.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  NODE_VERSION: "26"

jobs:
  go:
    name: go (format, lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: Build
        run: make build-go

      - name: Test
        run: make test-go

      # The spec is part of the API contract (§18), so a handler change that
      # skips it is an incomplete change. This runs as its own step rather than
      # inside `make test-go` so a contract break is legible in the job list as
      # a contract break, not as "some test failed".
      #
      # No new toolchain: it is `go test`, pinned through go.mod like every
      # other dependency. The Node linters considered instead (Redocly,
      # Spectral) both carry telemetry, and validating the YAML would not have
      # caught drift between the spec and the handlers anyway.
      - name: API contract (spec valid, and matches the handlers)
        run: make lint-api

      # The chart grants privileges in a cluster, so its security properties are
      # tested rather than reviewed: every container non-root with a read-only
      # root filesystem and no capabilities, every image pinned by digest (the
      # T-10 control), the API with no route to the internet. Helm is pinned by
      # digest for the same reason the scanners are.
      - name: Install helm
        run: |
          scripts/install-scanner.sh helm "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Helm chart (lint, and the security assertions)
        run: make lint-chart

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: make install-web

      - name: Lint
        run: make lint-web

      - name: Type-check
        run: make typecheck-web

      # ADR 031. Kept as its own step so a test failure is distinguishable from
      # a build failure in the log -- the same reasoning the image scan uses.
      - name: Test
        run: make test-web

      - name: Build
        run: make build-web

  migrations:
    name: migrations (apply and roll back)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: secureops
          # Ephemeral CI-only credential for a throwaway service container.
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: secureops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secureops -d secureops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECUREOPS_DATABASE_URL: postgres://secureops:ci-postgres-password@localhost:5432/secureops?sslmode=disable
      SECUREOPS_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A migration without a working rollback is not reviewable (§17).
      - name: Apply migrations
        run: make migrate-up

      - name: Roll back one migration
        run: make migrate-down

      - name: Re-apply migrations
        run: make migrate-up

  integration:
    name: integration (real postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: secureops
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: secureops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secureops -d secureops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECUREOPS_DATABASE_URL: postgres://secureops:ci-postgres-password@localhost:5432/secureops?sslmode=disable
      SECUREOPS_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Apply migrations
        run: go run ./cmd/migrate -dir migrations up

      - name: Run integration tests
        run: go test -tags=integration ./tests/... -race -count=1

  self-scan:
    name: self-scan (SecureOps scans SecureOps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks inspects history, so the full clone is required.
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semgrep/semgrep is the CLI's source repository, not a GitHub Action, so
      # it cannot be used with `uses:`. Installing the pinned CLI is better
      # anyway: it removes a third-party action from CI's attack surface (§16)
      # and runs the exact command `make scan-sast` runs locally.
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"

      - name: Install semgrep
        run: pip install semgrep==1.183.0

      - name: SAST (semgrep)
        run: make scan-sast

      - name: Filesystem, config, and dependency scan (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          # node_modules is a build artifact, not source under review.
          skip-dirs: apps/web/node_modules

      # syft and grype are installed directly rather than through the anchore
      # actions. The actions bundle their own tool versions, so CI was scanning
      # a different dependency set than `make security` -- it reported CVEs in
      # golang-migrate's alternate database drivers (docker, containerd, otel),
      # none of which are linked into any SecureOps binary (`go version -m
      # bin/*` reports zero). Installing pinned versions and running the
      # Makefile targets keeps CI and local byte-for-byte identical, and drops
      # two third-party actions from CI's attack surface (§16, §22).
      #
      # The versions and their digests live in scripts/install-scanner.sh. CI
      # previously piped the vendors' installers into a shell, which pinned the
      # tool and left whatever that URL served free to run as the installer.
      - name: Install syft and grype
        run: |
          scripts/install-scanner.sh syft  "$RUNNER_TEMP/bin"
          scripts/install-scanner.sh grype "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify pinned scanner versions
        run: |
          syft version
          grype version

      - name: Generate SBOM (syft)
        run: make sbom

      - name: Dependency vulnerabilities (grype)
        run: make scan-deps

      # Container images are scanned here and nowhere else. `trivy fs` above
      # scans the filesystem and Dockerfiles, not a built image, which is how
      # a worker image carrying 32 HIGH/CRITICAL CVEs reached a working state
      # unnoticed -- it was found only by running `trivy image` by hand
      # (threat model T-29, ADR 009).
      #
      # This runs in CI rather than in `make security` because it must build
      # both images, and `security` has to stay fast enough to run before
      # every commit.
      # The trivy CLI is installed explicitly rather than reusing the action
      # above: the action does not guarantee trivy on PATH, and the scan step
      # below invokes `make scan-image` -- literally the local command, so the
      # two cannot drift.
      # Its installer came off the `main` branch -- mutable by definition, so
      # the code granted execution here was whatever that branch held today.
      - name: Install trivy
        run: |
          scripts/install-scanner.sh trivy "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Kept as its own step so a build failure is distinguishable from a
      # scan failure in the log. `make scan-image` depends on this target, so
      # the rebuild in the next step is a cache hit.
      - name: Build images
        run: make build-images

      - name: Container image scan (trivy)
        run: |
          trivy --version
          make scan-image

      # A second binary-level gate, and not a redundant one. On the same image
      # trivy reported 0 advisories in gitleaks and syft where govulncheck
      # reported 4 and 2 -- four of them with published fixes. Trivy is a
      # general scanner; govulncheck knows which Go packages a binary actually
      # links and which symbols survived the linker (ADR 013).
      #
      # Runs here rather than in the `go` job because it needs the worker image
      # built, which the steps above have already done.
      - name: Go advisories (govulncheck)
        run: make lint-vuln

      # An SBOM that is generated and discarded is not a feature (spec §22).
      # Keeping it also makes any CI/local discrepancy inspectable.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: warn
